<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alpha Extractor - Daily Digest</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #000000;
        }

        .markdown-body h1 {
            font-size: 22px;
            font-weight: 700;
            color: rgb(0, 229, 255);
            font-family: "Courier New", "Roboto Mono", monospace;
            border-bottom: 1px solid rgba(0, 229, 255, 0.3);
            padding-bottom: 8px;
            margin-top: 32px;
            text-transform: uppercase;
        }

        .markdown-body h2 {
            font-size: 16px;
            font-weight: 700;
            color: rgb(255, 255, 255);
            font-family: "Courier New", monospace;
            margin-top: 24px;
            margin-bottom: 16px;
            background-color: rgba(18, 18, 18, 0.8);
            padding: 10px;
            border-radius: 4px;
            border-left: 3px solid rgb(0, 229, 255);
        }

        .markdown-body h3 {
            font-size: 14px;
            font-weight: 700;
            color: rgb(0, 229, 255);
            font-family: "Courier New", monospace;
            margin-top: 20px;
            margin-bottom: 8px;
        }

        .markdown-body p,
        .markdown-body li {
            font-size: 14px;
            line-height: 1.6;
            color: rgb(204, 204, 204);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        .markdown-body a {
            color: rgb(0, 229, 255);
            text-decoration: none;
        }

        /* Styles the AI "Actionable Edge" blockquotes to look like your Figma cards */
        .markdown-body blockquote {
            background-color: rgba(0, 229, 255, 0.05);
            border: 1px solid rgba(0, 229, 255, 0.2);
            border-radius: 6px;
            padding: 14px;
            margin: 16px 0;
            font-style: italic;
            color: rgb(229, 229, 229);
            border-left: 4px solid rgb(0, 229, 255);
        }

        .markdown-body hr {
            border: 0;
            border-top: 1px dashed rgba(136, 136, 136, 0.3);
            margin: 32px 0;
        }
    </style>
</head>

<body style="margin: 0; padding: 0; background-color: #000000;">

    <div
        style="max-width: 650px; margin: 0px auto; background-color: rgb(10, 10, 12); color: rgb(229, 229, 229); font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; padding: 0px;">

        <div
            style="padding: 32px 24px 24px; border-bottom: 1px solid rgb(0, 229, 255); box-shadow: rgba(0, 229, 255, 0.3) 0px 1px 20px;">
            <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px;">
                <div style="display: flex; align-items: center; gap: 12px;">
                    <div
                        style="width: 40px; height: 40px; background: rgba(10, 10, 12, 0.8); border-radius: 8px; display: flex; align-items: center; justify-content: center; border: 1px solid rgba(0, 229, 255, 0.3);">
                        <svg width="36" height="36" viewBox="0 0 120 120" fill="none"
                            xmlns="http://www.w3.org/2000/svg">
                            <circle cx="60" cy="60" r="52" opacity="0.2" stroke="url(#emailRingGradient)"
                                stroke-width="1"></circle>
                            <g>
                                <circle cx="20" cy="75" r="7" fill="url(#emailNodeGradient)" opacity="0.9"></circle>
                                <circle cx="20" cy="75" r="4" fill="#60a5fa"></circle>
                                <circle cx="35" cy="95" r="7" fill="url(#emailNodeGradient)" opacity="0.9"></circle>
                                <circle cx="35" cy="95" r="4" fill="#60a5fa"></circle>
                                <circle cx="60" cy="100" r="7" fill="url(#emailNodeGradient)" opacity="0.9"></circle>
                                <circle cx="60" cy="100" r="4" fill="#60a5fa"></circle>
                                <circle cx="85" cy="95" r="7" fill="url(#emailNodeGradient)" opacity="0.9"></circle>
                                <circle cx="85" cy="95" r="4" fill="#60a5fa"></circle>
                                <circle cx="100" cy="75" r="7" fill="url(#emailNodeGradient)" opacity="0.9"></circle>
                                <circle cx="100" cy="75" r="4" fill="#60a5fa"></circle>
                            </g>
                            <g>
                                <line x1="20" y1="75" x2="60" y2="30" stroke="url(#emailFlowGradient)" stroke-width="2"
                                    opacity="0.5"></line>
                                <line x1="35" y1="95" x2="60" y2="30" stroke="url(#emailFlowGradient)" stroke-width="2"
                                    opacity="0.5"></line>
                                <line x1="60" y1="100" x2="60" y2="30" stroke="url(#emailFlowGradient)" stroke-width="2"
                                    opacity="0.5"></line>
                                <line x1="85" y1="95" x2="60" y2="30" stroke="url(#emailFlowGradient)" stroke-width="2"
                                    opacity="0.5"></line>
                                <line x1="100" y1="75" x2="60" y2="30" stroke="url(#emailFlowGradient)" stroke-width="2"
                                    opacity="0.5"></line>
                            </g>
                            <path d="M 60 18 L 75 26 L 75 42 L 60 50 L 45 42 L 45 26 Z"
                                stroke="url(#emailFrameGradient)" stroke-width="1.5" fill="none" opacity="0.4"></path>
                            <g>
                                <circle cx="60" cy="30" r="14" fill="url(#emailGlowGradient)" opacity="0.3"></circle>
                                <circle cx="60" cy="30" r="4.5" fill="#00E5FF" opacity="0.95"></circle>
                                <circle cx="60" cy="30" r="2.5" fill="#ffffff" opacity="0.9"></circle>
                            </g>
                            <defs>
                                <linearGradient id="emailRingGradient" x1="0%" y1="0%" x2="100%" y2="100%">
                                    <stop offset="0%" stop-color="#60a5fa"></stop>
                                    <stop offset="50%" stop-color="#2dd4bf"></stop>
                                    <stop offset="100%" stop-color="#60a5fa"></stop>
                                </linearGradient>
                                <radialGradient id="emailNodeGradient">
                                    <stop offset="0%" stop-color="#60a5fa"></stop>
                                    <stop offset="100%" stop-color="#3b82f6"></stop>
                                </radialGradient>
                                <linearGradient id="emailFlowGradient" x1="0%" y1="100%" x2="0%" y2="0%">
                                    <stop offset="0%" stop-color="#60a5fa" stop-opacity="0.4"></stop>
                                    <stop offset="50%" stop-color="#2dd4bf" stop-opacity="0.7"></stop>
                                    <stop offset="100%" stop-color="#00E5FF" stop-opacity="0.9"></stop>
                                </linearGradient>
                                <linearGradient id="emailFrameGradient" x1="0%" y1="0%" x2="100%" y2="100%">
                                    <stop offset="0%" stop-color="#00E5FF"></stop>
                                    <stop offset="100%" stop-color="#2dd4bf"></stop>
                                </linearGradient>
                                <radialGradient id="emailGlowGradient">
                                    <stop offset="0%" stop-color="#00E5FF"></stop>
                                    <stop offset="100%" stop-color="transparent"></stop>
                                </radialGradient>
                            </defs>
                        </svg>
                    </div>
                    <div>
                        <div
                            style="font-size: 22px; font-weight: 700; letter-spacing: 3px; color: rgb(0, 229, 255); font-family: 'Courier New', 'Roboto Mono', monospace; text-shadow: rgba(0, 229, 255, 0.5) 0px 0px 10px, rgba(0, 229, 255, 0.3) 0px 0px 20px; text-transform: uppercase;">
                            ALPHA EXTRACTOR</div>
                    </div>
                </div>
                <div
                    style="font-family: 'Courier New', monospace; font-size: 11px; color: rgb(136, 136, 136); text-align: right;">
                    {{ date }}</div>
            </div>
            <div
                style="font-family: 'Courier New', monospace; font-size: 12px; color: rgb(0, 229, 255); letter-spacing: 0.5px;">
                SYS_DIGEST // AUTOMATED_INSIGHTS // ASSETS_PROCESSED: {{ target_count }}
            </div>
        </div>

        <div style="padding: 24px;" class="markdown-body">
            {{ markdown_content | safe }}
        </div>

        <div style="border-top: 1px solid rgb(26, 26, 28); padding: 24px; background-color: rgb(5, 5, 7);">
            <div style="font-size: 12px; color: rgb(102, 102, 102); margin-bottom: 12px; text-align: center;">
                AI-Generated Intelligence. Not Financial Advice.</div>
            <div
                style="font-family: 'Courier New', monospace; font-size: 10px; color: rgb(68, 68, 68); margin-bottom: 14px; text-align: center;">
                Trace ID: {{ trace_id | default('N/A') }}</div>
            <div style="display: flex; justify-content: center; gap: 16px; font-size: 12px;">
                <a href="#" style="color: rgb(0, 229, 255); text-decoration: none;">Manage Preferences</a>
                <span style="color: rgb(51, 51, 51);">|</span>
                <a href="#" style="color: rgb(0, 229, 255); text-decoration: none;">Unsubscribe</a>
            </div>
        </div>

    </div>
</body>

</html>
