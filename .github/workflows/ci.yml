name: CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
    tags: [ "v*.*.*" ]
  pull_request:
    branches: [ "main" ]

env:
  REGISTRY: hyd.ocir.io
  # This dynamically builds the URL using the secrets you saved in AE28
  IMAGE_NAME: ${{ secrets.OCI_NAMESPACE }}/alpha-extractor/api
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  test:
    name: Lint & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: ".python-version"

      - name: Install dependencies (dev extras for coverage)
        run: make install-dev

      - name: Run Linters
        run: make lint

      - name: Run Tests
        run: make test

      - name: Run Coverage
        run: make coverage

      - name: Upload coverage.xml
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml

  build-and-push:
    name: Build & Push ARM64 Docker Image
    needs: test
    runs-on: ubuntu-latest
    # Only push the image if the code is merged to main or a release tag is pushed
    if: github.event_name == 'push'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # This step allows x86 GitHub runners to build ARM64 images
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Oracle Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.OCI_USERNAME }}
          password: ${{ secrets.OCI_AUTH_TOKEN }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=sha

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          # Force compilation for your Oracle ARM instances
          platforms: linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Use GitHub Actions cache to dramatically speed up future builds
          cache-from: type=gha
          cache-to: type=gha,mode=max

  package-and-push-helm:
      name: Package & Push Helm Chart
      needs: build-and-push
      runs-on: ubuntu-latest
      # Only run on tags like v0.2.0
      if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
      env:
        CHART_PATH: deploy/helm/alpha-extractor
        CHART_NAME: alpha-extractor
        HELM_REGISTRY_REPO: oci://${{ env.REGISTRY }}/${{ secrets.OCI_NAMESPACE }}/helm
      steps:
        - name: Checkout repository
          uses: actions/checkout@v4

        - name: Set up Helm
          uses: azure/setup-helm@v4

        - name: Resolve chart version from git ref
          id: chart_version
          shell: bash
          run: |
            VERSION="${GITHUB_REF#refs/tags/v}"
            echo "version=$VERSION" >> "$GITHUB_OUTPUT"

        - name: Update chart and image versions
          shell: bash
          run: |
            VERSION="${{ steps.chart_version.outputs.version }}"
            # Update the Chart version
            sed -i "s/^version:.*/version: ${VERSION}/" "$CHART_PATH/Chart.yaml"
            sed -i "s/^appVersion:.*/appVersion: \"${VERSION}\"/" "$CHART_PATH/Chart.yaml"
            # Update the Docker image tag the Helm chart points to
            sed -i "s/^  tag:.*/  tag: \"${VERSION}\"/" "$CHART_PATH/values.yaml"

        - name: Helm lint
          run: helm lint "$CHART_PATH"

        - name: Helm package
          run: helm package "$CHART_PATH" --destination .

        - name: Login to OCI Helm Registry
          run: echo "${{ secrets.OCI_AUTH_TOKEN }}" | helm registry login "$REGISTRY" -u "${{ secrets.OCI_USERNAME }}" --password-stdin

        - name: Push Helm chart to OCI
          shell: bash
          run: |
            CHART_TGZ=$(ls ${CHART_NAME}-*.tgz | head -n1)
            helm push "$CHART_TGZ" "$HELM_REGISTRY_REPO"