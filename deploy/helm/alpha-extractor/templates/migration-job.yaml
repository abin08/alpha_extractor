apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .Release.Name }}-db-migration
  namespace: {{ .Release.Namespace }}
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: HookSucceeded,BeforeHookCreation
spec:
  # Retries 2 times if the database happens to be briefly unavailable
  backoffLimit: 2
  template:
    metadata:
      name: alembic-migration-pod
    spec:
      restartPolicy: Never
      
      # Pulls 'ocir-secret' from your ArgoCD parameters
      {{- if .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml .Values.imagePullSecrets | nindent 8 }}
      {{- end }}
      
      containers:
        - name: alembic-migration
          # Uses the exact same image and tag as your API and Worker pods
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy | default "IfNotPresent" }}
          
          # The exact command to execute inside the container
          command: ["uv", "run", "alembic", "upgrade", "head"]
          
          # Injects DATABASE_URL and others from 'alpha-extractor-secrets'
          envFrom:
            - secretRef:
                name: {{ .Values.env.secretName }}