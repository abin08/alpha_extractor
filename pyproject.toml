[project]
name = "alpha_extractor"
version = "0.8.2"
description = "AI-driven financial sentiment extraction pipeline"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.29.0",
    "celery>=5.3.6",
    "redis>=5.0.3",
    "aiohttp>=3.9.3",
    "google-genai>=0.5.0",
    "sqlalchemy>=2.0.29",
    "asyncpg>=0.29.0",
    "pydantic>=2.6.4",
    "pydantic-settings>=2.2.1",
    "beautifulsoup4>=4.12.3",
    "feedparser>=6.0.11",
    "yfinance>=0.2.37",
    "alembic>=1.13.1",
    "greenlet>=3.0.3",
    "pytest>=8.1.1",
    "pytest-asyncio>=0.23.6",
    "httpx>=0.27.0",
    "aiosqlite>=0.20.0",
    "pandas>=3.0.1",
    "lxml>=6.0.2",
    "aioboto3>=15.5.0",
    "pypdf>=6.9.2",
    "markdown>=3.10.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.1.1",
    "pytest-asyncio>=0.23.6",
    "pytest-cov>=5.0.0",
    "ruff>=0.3.4",
    "pre-commit>=3.7.0",
    "commitizen>=3.20.0"
]

[tool.commitizen]
name = "cz_conventional_commits"
tag_format = "v$version"
legacy_tag_formats = ["$version"]
version = "0.8.2"
version_files = [
    "pyproject.toml:version"
]
update_changelog_on_bump = true

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = []

[dependency-groups]
dev = [
    "pytest-asyncio>=1.3.0",
]

