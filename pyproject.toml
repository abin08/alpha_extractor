[project]
name = "alpha_extractor"
version = "0.1.0"
description = "AI-driven financial sentiment extraction pipeline"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.29.0",
    "celery>=5.3.6",
    "redis>=5.0.3",
    "aiohttp>=3.9.3",
    "google-genai>=0.5.0",
    "sqlalchemy>=2.0.29",
    "asyncpg>=0.29.0",
    "pydantic>=2.6.4",
    "pydantic-settings>=2.2.1",
    "beautifulsoup4>=4.12.3",
    "feedparser>=6.0.11",
    "yfinance>=0.2.37"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.1.1",
    "pytest-asyncio>=0.23.6",
    "ruff>=0.3.4",
    "pre-commit>=3.7.0",
    "commitizen>=3.20.0"
]

[tool.commitizen]
name = "cz_conventional_commits"
version = "0.1.0"
version_files = [
    "pyproject.toml:version"
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = []

