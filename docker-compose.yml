services:
  # 1. Relational Database (Metadata & Final Results)
  postgres:
    image: postgres:16-alpine
    container_name: alpha_extractor_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: alpha_extractor
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d alpha_extractor"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 2. In-Memory Datastore (Celery Broker & Circuit Breaker)
  redis:
    image: redis:7-alpine
    container_name: alpha_extractor_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # 3. Object Storage Data Lake (Raw HTML/XML Dumps)
  minio:
    image: minio/minio:latest
    container_name: alpha_extractor_minio
    restart: always
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000" # API Port
      - "9001:9001" # Console UI Port
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 5

  # 4. Auto-Setup Bucket Utility (Creates the bucket and exits)
  minio-setup:
    image: minio/mc:latest
    container_name: alpha_extractor_minio_setup
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local_s3 http://minio:9000 minioadmin minioadmin;
      mc mb local_s3/alpha-extractor-raw --ignore-existing;
      mc policy set public local_s3/alpha-extractor-raw;
      echo 'MinIO Bucket Setup Complete!';
      exit 0;
      "

volumes:
  postgres_data:
  redis_data:
  minio_data: